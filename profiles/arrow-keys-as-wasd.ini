; Arrow keys as WASD
; For games that only read WASD when you would rather use the arrows.
; Fill in "match" with the game so this does not follow you around.

[profile]
name        = Arrow keys as WASD
description = The arrow keys move in games that only understand WASD.
enabled     = no
match       =

[keys]
Up    = w
Left  = a
Down  = s
Right = d
