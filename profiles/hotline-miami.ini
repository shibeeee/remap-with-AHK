; Hotline Miami
; Press E to throw or pick up, instead of right clicking the trackpad.
; Format: when I press = what the app receives, options   ; note

[profile]
name        = Hotline Miami
description = Throw and pick up with E instead of right click.
enabled     = yes
match       = HotlineMiami.exe, HotlineMiami2.exe

[keys]
e = RButton, block       ; throw / pick up, the game sees a right click
q = LButton, off         ; turn this on to attack with Q as well
f = MButton, off         ; middle click, unused by the game by default
