; Laptop trackpad
; Mouse buttons from the keyboard, for trackpads that make them awkward.
; Works everywhere because "match" is blank. Narrow it to one program
; with the Choose programs button if you would rather it stayed local.

[profile]
name        = Laptop trackpad
description = Right click and middle click from the keyboard.
enabled     = no
match       =

[keys]
RAlt  = RButton          ; right click
RCtrl = MButton, off     ; middle click, for opening links in a new tab
