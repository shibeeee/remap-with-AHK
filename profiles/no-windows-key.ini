; No Windows key
; Stops the Windows key from minimising a game mid fight.
; Fill in "match" with your game, or leave it blank to block it everywhere.

[profile]
name        = No Windows key
description = Swallows the Windows key so nothing gets minimised.
enabled     = no
match       =

[keys]
LWin = none              ; none = the key is swallowed, nothing is sent
RWin = none
